[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sdlc-qe-ontology-workbench"
version = "0.1.0"
description = "Local-first SDLC and quality engineering ontology workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1",
  "pyshacl>=0.30,<1",
  "rdflib>=7,<9",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "jsonschema>=4.22,<5",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F"]
